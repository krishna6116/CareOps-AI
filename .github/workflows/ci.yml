name: CareOps-AI CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Unit and pipeline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Backend API tests
        run: python -m pytest backend/app/tests -q

  pipeline-smoke:
    # End-to-end run on a small synthetic scenario (25% of patient and
    # appointment volume, history to 2025-06-30). It checks that every stage
    # runs and every gate passes; published results come from the full run.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAREOPS_SCENARIO_SCALE: "0.25"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Run the pipeline
        run: python run_portfolio.py --as-of-date 2025-06-30
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-summary
          path: |
            optimization/resource_planning/outputs/portfolio_run_manifest.json
            optimization/resource_planning/outputs/reliability_scorecard.txt
            docs/MODEL_METRICS.md
          if-no-files-found: warn

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build
