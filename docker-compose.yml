services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careops
      POSTGRES_USER: careops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careops -d careops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    environment:
      CAREOPS_DATABASE_URL: postgresql+psycopg://careops:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/careops
      CAREOPS_ENVIRONMENT: development
      CAREOPS_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      CAREOPS_LLM_PROVIDER: ${CAREOPS_LLM_PROVIDER:-deterministic}
      CAREOPS_LLM_MODEL: ${CAREOPS_LLM_MODEL:-gpt-4o-mini}
      CAREOPS_LLM_BASE_URL: ${CAREOPS_LLM_BASE_URL:-http://127.0.0.1:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: sh -c "python -m alembic -c backend/alembic.ini upgrade head && exec python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
